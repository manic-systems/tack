name: Pins Update

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    uses: manic-systems/workflows/.github/workflows/pins-update.yml@02fcd089a850e25bc6eff55f74db80c12b54391e # v2.3.4
    with:
      client-id: ${{ vars.MANIC_BOT_CLIENT_ID }}
    secrets:
      private-key: ${{ secrets.MANIC_BOT_PRIVATE_KEY }}
