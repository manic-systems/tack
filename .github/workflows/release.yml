name: Tag and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  prepare:
    name: Prepare Release
    permissions:
      contents: write
      id-token: write
    needs: ci
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@02fcd089a850e25bc6eff55f74db80c12b54391e # v2.3.4
    with:
      stage: prepare
      version-command: nix run nixpkgs#fq -- -r .package.version Cargo.toml

  build:
    name: Build tack (${{ matrix.suffix }})
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-amd64
          - os: ubuntu-26.04-arm
            suffix: linux-arm64
    uses: manic-systems/workflows/.github/workflows/rust-build.yml@02fcd089a850e25bc6eff55f74db80c12b54391e # v2.3.4
    with:
      upload: true
      version: ${{ needs.prepare.outputs.version }}
      os: ${{ matrix.os }}
      suffix: ${{ matrix.suffix }}

  finalize:
    name: Finalize Release
    permissions:
      contents: write
      id-token: write
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.build.result == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@02fcd089a850e25bc6eff55f74db80c12b54391e # v2.3.4
    with:
      stage: finalize
      version: ${{ needs.prepare.outputs.version }}