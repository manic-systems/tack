version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude: [manic-systems/*]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
