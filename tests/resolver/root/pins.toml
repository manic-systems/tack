[all_follow]
dep = "replacement"

[omit_inputs]
names = [ "drop", "dep", "keepme", "flake:scoped" ]

[inputs.replacement]
type = "fetch"
url  = "path:../replacement"

[inputs.top]
follows     = { immediate = "replacement" }
keep_inputs = [ "keepme", "scoped" ]
type        = "fetch"
url         = "path:../level1"

[inputs.topflake]
url = "path:../level-flake"

[inputs.badlocal]
omit_inputs = "drop"
type        = "fetch"
url         = "path:../original"

[inputs.dupfollow]
follows = { "flake:value" = "replacement", value = "replacement" }
type    = "fetch"
url     = "path:../original"

[inputs.badexclude]
exclude_follow = "dep"
type           = "fetch"
url            = "path:../original"

[inputs.fixedpin]
type = "fixed"
url  = "https://example.invalid/fixed.txt"

[inputs.ghpin]
url = "github:example/repo"

[inputs.renamed]
follows = "replacement"

[inputs.rechained]
follows = "renamed"

[inputs.loopa]
follows = "loopb/x"

[inputs.loopb]
follows = "loopa/y"

[inputs.lockflow]
url = "path:../lock-follows"

[inputs.legacy]
type = "fetch"
url  = "path:../legacy"

[inputs.tablewalk]
follows = { immediate = "topflake/mid" }
type    = "fetch"
url     = "path:../level1"

# follows paths into upstream tack pins
[inputs.viaflake]
follows = "topflake/mid"

[inputs.viaflakedeep]
follows = "topflake/mid/dep"

[inputs.viafetch]
follows = "top/immediate"

[inputs.viafetchdeep]
follows = "top/mid/dep"

[inputs.chained]
follows = "viaflake/dep"

[inputs.bareclash]
follows = "topflake/scoped"

[inputs.tackclash]
follows = "topflake/tack:scoped"

[inputs.flakeclash]
follows = "topflake/flake:scoped"

[inputs.notack]
follows = "topflake/tack:nope"

[inputs.noflake]
follows = "topflake/flake:mid"

[inputs.vialegacy]
follows = "legacy/leaf"

[inputs.pastlegacy]
follows = "legacy/leaf/x"

[inputs.lazyflake]
url = "path:../lazy-flake"

[inputs.vialazy]
follows = "lazyflake/leaf"
